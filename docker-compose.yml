version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bello-postgres
    restart: always
    environment:
      POSTGRES_USER: bello_admin
      POSTGRES_PASSWORD: admin_password_super_secret
      POSTGRES_DB: bello_db
    ports:
      - "5432:5432"
    volumes:
      - bello-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  bello-db-data:
